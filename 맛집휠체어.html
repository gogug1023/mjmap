
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport", content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>명지대 맛집 탐색기 PRO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        #sidebar { width: 300px; height: 100%; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; position: absolute; left: -300px; transition: left 0.3s ease; z-index: 2000; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        #sidebar.open { left: 0; }
        #toggle-btn { position: absolute; top: 15px; left: 15px; z-index: 2100; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 1500; display: none; }
        #overlay.show { display: block; }
        #search-box { padding: 15px; border-bottom: 1px solid #ddd; }
        #search-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        #list-container { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
        .restaurant-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .restaurant-item.active { background: #e7f1ff; border-left: 4px solid #007bff; }
        .res-name { font-weight: bold; display: block; }
        .res-info { font-size: 0.85em; color: #666; }
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; }
        #info-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: white; padding: 12px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; display: none; white-space: nowrap; font-size: 0.9em; }
        .custom-icon { display: flex; justify-content: center; align-items: center; width: 32px; height: 32px; background: white; border-radius: 50%; border: 2px solid currentColor; color: currentColor; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .wc-badge { color: #007bff; font-size: 12px; margin-left: 4px; }
        #admin-mode-btn { position: absolute; top: 15px; right: 15px; z-index: 2100; padding: 8px 12px; background: #343a40; color: white; border: none; border-radius: 10px; font-size: 12px; cursor: pointer; }
        #admin-panel { position: absolute; top: 0; right: 0; width: 300px; height: 100%; background: #f8f9fa; z-index: 3000; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .admin-item { background: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 12px; border: 1px solid #ddd; }
        .btn-delete { color: red; cursor: pointer; float: right; }
        .btn-export { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <button id="toggle-btn" onclick="toggleSidebar()">🍴 목록</button>
    <button id="admin-mode-btn" onclick="loginAdmin()">🔐 관리자</button>
    <div id="overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div id="search-box"><input type="text" id="search-input" placeholder="가게 이름 검색..." onkeyup="filterList()"></div>
        <ul id="list-container"></ul>
    </div>
    <div id="map"></div>
    <div id="info-panel"></div>
    <div id="admin-panel">
        <h3>🛠️ 관리자 모드</h3>
        <p id="admin-msg">로그인 필요</p>
        <div id="admin-controls" style="display:none;">
            <button class="btn-export" onclick="exportReviews()">📊 리뷰 데이터 다운로드</button>
            <hr>
            <h4>모든 리뷰 관리</h4>
            <div id="admin-review-list"></div>
        </div>
    </div>

            sb.classList.toggle('open');
            ov.classList.toggle('show');
            btn.innerText = sb.classList.contains('open') ? "❌ 닫기" : "🍴 목록";
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([37.5845, 126.9258], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const container = document.getElementById('list-container');
            restaurants.forEach((res) => {
                const li = document.createElement('li');
                li.className = 'restaurant-item';
                const wcIcon = res.is_wheelchair ? " <i class='fa-solid fa-wheelchair wc-badge'></i>" : "";
                li.innerHTML = `<span class="res-name">${res.상호명}${wcIcon}</span><span class="res-info">${res.주소} | ${res.카테고리}</span>`;
                li.onclick = () => { setTarget(res, li); if(window.innerWidth < 768) toggleSidebar(); };
                container.appendChild(li);
                
                const cat = categoryMap[res.카테고리] || categoryMap['기타'];
                const marker = L.marker([res.y_axis, res.x_axis], { icon: createFontIcon(cat.icon, cat.color) }).addTo(map);
                const wcText = res.is_wheelchair ? `<br><b style="color:#007bff;">♿ 휠체어 이용 가능</b>` : "";
                marker.bindPopup(`<b style="font-size:14px;">${res.상호명}</b><br>${res.주소}<br><small>${res.카테고리}</small>${wcText}`);
                marker.on('click', () => {
                    const items = document.getElementsByClassName('restaurant-item');
                    for(let i=0; i<items.length; i++) {
                        if(items[i].innerText.includes(res.상호명)) { setTarget(res, items[i]); break; }
                    }
                });
            });

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    userMarker = L.marker([userCoords.lat, userCoords.lon], { icon: createFontIcon('fa-location-dot', '#007bff') }).addTo(map).bindPopup("📍 내 위치");
                    map.setView([userCoords.lat, userCoords.lon], 16);
                });
            }
        }

        function filterList() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const items = document.getElementsByClassName('restaurant-item');
            for (let item of items) item.style.display = item.innerText.toLowerCase().includes(q) ? "" : "none";
        }

        function setTarget(res, listItem) {
            currentTargetId = res.상호명;
            if (targetMarker) map.removeLayer(targetMarker);
            if (polyline) map.removeLayer(polyline);
            document.querySelectorAll('.restaurant-item').forEach(el => el.classList.remove('active'));
            listItem.classList.add('active');

            const targetCoords = [res.y_axis, res.x_axis];
            
            // 1. FlyTo 애니메이션
            map.flyTo(targetCoords, 18, { duration: 1.5 });
            
            targetMarker = L.marker(targetCoords, { icon: createFontIcon('fa-flag', '#f39c12') }).addTo(map);

            const panel = document.getElementById('info-panel');
            panel.style.display = 'block';

            // 2. 리뷰 UI 로직
            let reviewHtml = `<div class="review-list" id="review-list-${res.상호명}">`;
            if(reviews[res.상호명]) {
                reviews[res.상호명].forEach(r => {
                    reviewHtml += `<div class="review-item"><div class="star-rating">${'⭐'.repeat(r.rating)}</div><div>${r.comment}</div><small>${r.date}</small></div>`;
                });
            } else { reviewHtml += `<div style="color:#999; padding:5px;">리뷰가 없습니다.</div>`; }
            reviewHtml += `</div>`;

            // 3. 경로 및 거리/시간 계산 (핵심 복구 부분)
            let pathInfo = "";
            if (userCoords) {
                const dist = calculate_distance_js(userCoords.lat, userCoords.lon, res.y_axis, res.x_axis);
                const time = Math.round((dist / 1.38) / 60);
                
                // 경로 선 그리기
                polyline = L.polyline([[userCoords.lat, userCoords.lon], targetCoords], { color: '#007bff', weight: 4, opacity: 0.5, dashArray: '5, 10' }).addTo(map);
                
                // 거리/시간 정보 추가
                pathInfo = `<div style="margin-top:5px; font-size:11px; color:#666;">📏 ${Math.round(dist/1000*100)/100}km | ⏱ 약 ${time}분</div>`;
            }

            panel.innerHTML = `
                <div style="font-weight:bold; color:#007bff;">🎯 ${res.상호명}</div>
                ${reviewHtml}
                <div class="review-input-area" style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                    <div class="star-rating" id="star-${res.상호명}" data-rating="0">
                        <i class="fa-regular fa-star" onclick="setRating('${res.상호명}', 1)"></i>
                        <i class="fa-regular fa-star" onclick="setRating('${res.상호명}', 2)"></i>
                        <i class="fa-regular fa-star" onclick="setRating('${res.상호명}', 3)"></i>
                        <i class="fa-regular fa-star" onclick="setRating('${res.상호명}', 4)"></i>
                        <i class="fa-regular fa-star" onclick="setRating('${res.상호명}', 5)"></i>
                    </div>
                    <input type="text" id="review-text-${res.상호명}" placeholder="리뷰 입력..." style="width:80%; padding:5px; border-radius:5px; border:1px solid #ddd; margin-top:5px;">
                    <button onclick="submitReview('${res.상호명}')" style="padding:5px 10px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; margin-top:5px;">등록</button>
                </div>
                ${pathInfo}
            `;
            renderReviews(res.상호명);
        }

        // JavaScript용 거리 계산 함수
        function calculate_distance_js(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function submitReview(resId) {
            const starEl = document.getElementById(`star-${resId}`);
            const textEl = document.getElementById(`review-text-${resId}`);
            const rating = parseInt(starEl.getAttribute('data-rating') || 0);
            const comment = textEl.value;
            if(rating === 0 || !comment) { alert("별점과 내용을 입력해주세요!"); return; }
            if(!reviews[resId]) reviews[resId] = [];
            reviews[resId].push({ rating, comment, date: new Date().toLocaleDateString() });
            localStorage.setItem('my_reviews', JSON.stringify(reviews));
            renderReviews(resId);
            textEl.value = "";
        }

        function renderReviews(resId) {
            const container = document.getElementById(`review-list-${resId}`);
            if(!container) return;
            container.innerHTML = "";
            if(reviews[resId]) {
                reviews[resId].forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'review-item';
                    div.innerHTML = `<div class="star-rating">${'⭐'.repeat(r.rating)}</div><div>${r.comment}</div><small>${r.date}</small>`;
                    container.appendChild(div);
                });
            } else { container.innerHTML = `<div style="color:#999; padding:5px;">리뷰가 없습니다.</div>`; }
        }

        function setRating(resId, rating) {
            const starEl = document.getElementById(`star-${resId}`);
            starEl.setAttribute('data-rating', rating);
            starEl.innerHTML = `'${'⭐'.repeat(rating)}'`;
        }

        function loginAdmin() {
            const pw = prompt("비밀번호:");
            if(pw === "1234") {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-msg').innerText = "✅ 관리자 로그인 성공";
                document.getElementById('admin-controls').style.display = 'block';
                renderAdminList();
            } else { alert("틀렸습니다."); }
        }

        function renderAdminList() {
            const container = document.getElementById('admin-review-list');
            container.innerHTML = "";
            for(let resId in reviews) {
                const res = restaurants.find(r => r.상호명 === resId);
                if(!res) continue;
                reviews[resId].forEach((rev, idx) => {
                    const div = document.createElement('div');
                    div.className = 'admin-item';
                    div.innerHTML = `<b style="font-size:11px;">${res.상호명}</b><br>${'⭐'.repeat(rev.rating)} | ${rev.comment}<br><span class="btn-delete" onclick="deleteReview('${resId}', ${idx})">삭제</span>`;
                    container.appendChild(div);
                });
            }
        }

        function deleteReview(resId, idx) {
            reviews[resId].splice(idx, 1);
            localStorage.setItem('my_reviews', JSON.stringify(reviews));
            renderAdminList();
            if(currentTargetId === resId) renderReviews(resId);
        }

        function exportReviews() {
            const blob = new Blob([JSON.stringify(reviews, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'reviews_export.json'; a.click();
        }

        function filterList() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const items = document.getElementsByClassName('restaurant-item');
            for (let item of items) item.style.display = item.innerText.toLowerCase().includes(q) ? "" : "none";
        }

        window.onload = initMap;
    </script>
</body>
</html>
